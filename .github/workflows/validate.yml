name: validate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      payload:
        description: Contexto opcional enviado pelo Pages CMS em JSON
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar estrutura editorial
        run: npm run check

      - name: Validar JavaScript
        run: node --check app.js

      - name: Validar sintaxe do empacotador PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/PA-SAFRA-BUILD-E-ARQUIVAR.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if (@($errors).Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'PowerShell parser: OK'

      - name: Gerar build
        run: npm run build

      - name: Smoke test do build
        run: npm run smoke

      - name: Guardar build validado
        uses: actions/upload-artifact@v4
        with:
          name: pa-safra-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Registrar resultado
        if: success()
        run: |
          echo "## PA Safra - validacao concluida" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`$GITHUB_REF_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm run check: OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- node --check app.js: OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- PowerShell parser do empacotador: OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm run build: OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm run smoke: OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- artefato dist: gerado por 14 dias" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Esta rotina apenas valida. Ela nao faz merge nem publica em producao." >> "$GITHUB_STEP_SUMMARY"
