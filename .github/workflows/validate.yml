name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Reconstruir e validar imagens do solicitante
        run: npm run images:prepare

      - name: Validar estrutura editorial e integridade de imagens
        run: npm run check

      - name: Validar contrato do admin nativo
        run: npm run admin:test

      - name: Testar autenticação e bloqueio de tentativas
        run: npm run admin:auth-test

      - name: Validar readiness Cloudflare
        run: npm run cloudflare:test

      - name: Simular ambiente Cloudflare Pages
        run: npm run cloudflare:env-test

      - name: Confirmar trava editorial enquanto pendente
        shell: bash
        run: |
          set +e
          output="$(npm run prepublish:check 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -eq 0 ]; then
            echo "ERRO: prepublish:check deveria bloquear enquanto publicacao.json estiver pendente."
            exit 1
          fi
          printf '%s\n' "$output" | grep -q "publicacao em producao bloqueada enquanto houver pendencias editoriais"
          echo "Trava editorial: BLOQUEIO CONFIRMADO"

      - name: Validar JavaScript
        run: |
          node --check app.js
          node --check public/admin/admin.js
          node --check functions/api/admin/login.js
          node --check functions/api/admin/logout.js
          node --check functions/api/admin/status.js
          node --check functions/api/admin/content.js
          node --check tools/admin-credentials.mjs
          node --check tools/admin-auth-test.mjs
          node --check tools/admin-preview-runtime-diagnostic.mjs
          node --check tools/smoke-remote.mjs
          node --check tools/admin-contract.mjs

      - name: Validar sintaxe dos scripts PowerShell
        shell: pwsh
        run: |
          $arquivos = @(
            'tools/PA-SAFRA-BUILD-E-ARQUIVAR.ps1',
            'tools/PA-SAFRA-GERAR-CREDENCIAIS-ADMIN.ps1',
            'tools/PA-SAFRA-AUDITAR-CLOUDFLARE-PREVIEW.ps1',
            'tools/PA-SAFRA-PROVISIONAR-D1-PREVIEW.ps1',
            'tools/PA-SAFRA-A18-CONTINUAR-D1-PREVIEW.ps1',
            'tools/PA-SAFRA-A19-CONFIGURAR-PREVIEW-AUTH.ps1',
            'tools/PA-SAFRA-A19-R3-CONTINUAR-PREVIEW-AUTH.ps1',
            'tools/PA-SAFRA-A19-R4-CORRIGIR-PBKDF2-PREVIEW.ps1',
            'tools/PA-SAFRA-A19-DIAGNOSTICAR-LOGIN-500.ps1',
            'tools/PA-SAFRA-A20-VALIDAR-RATE-LIMIT-PREVIEW.ps1'
          )
          foreach ($rel in $arquivos) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $rel),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if (@($errors).Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$rel - $($_.Message)" }
              exit 1
            }
            Write-Host "PowerShell parser: OK - $rel"
          }

      - name: Gerar build de desenvolvimento/preview
        run: npm run build

      - name: Smoke test do build
        run: npm run smoke

      - name: Guardar build validado
        uses: actions/upload-artifact@v4
        with:
          name: pa-safra-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Registrar resultado
        if: success()
        run: |
          echo "## PA Safra - validacao concluida" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`$GITHUB_REF_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- imagens do solicitante: reconstruidas e integridade WebP confirmada" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm run check: OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm run admin:test: OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm run admin:auth-test: OK (PBKDF2 100000, 401/429/Retry-After/cookie/fail-closed)" >> "$GITHUB_STEP_SUMMARY"
          echo "- hash PBKDF2 incompatível: resposta controlada 503, sem Worker exception" >> "$GITHUB_STEP_SUMMARY"
          echo "- autenticacao nativa usuario/senha e sessao assinada: sintaxe OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- scripts PowerShell, inclusive A19 R4 e gate A20 live do rate limiter: parser OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm run cloudflare:test: OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm run cloudflare:env-test: OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- trava editorial pendente: bloqueio confirmado" >> "$GITHUB_STEP_SUMMARY"
          echo "- sintaxe do site, admin nativo, Pages Functions e smoke remoto: OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm run build (advisory/preview): OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm run smoke: OK, inclusive assinatura/tamanho de imagens" >> "$GITHUB_STEP_SUMMARY"
          echo "- artefato dist: gerado por 14 dias" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Esta rotina valida o painel administrativo nativo, a compatibilidade PBKDF2 com Cloudflare Workers, o rate limiter D1, a preparacao Cloudflare, as imagens e confirma que a producao continua bloqueada enquanto as pendencias editoriais existirem. Ela nao faz merge nem publica em producao." >> "$GITHUB_STEP_SUMMARY"
